name: Build and check Fala
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fala_test
          POSTGRES_USER: fala_test
          POSTGRES_PASSWORD: fala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fala_test -d fala_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check web microphone, retries and offline family practice
        run: npm run test:web
      - name: Check production database driver and Android response format
        run: npm test -- tests/api.test.ts
        env:
          FALA_TEST_DATABASE_URL: postgres://fala_test:fala_test@127.0.0.1:5432/fala_test
      - run: npm run build
      - run: npx netlify functions:build --src netlify/functions --functions .netlify/functions
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore optional stable debug signing key
        env:
          FALA_DEBUG_KEYSTORE_BASE64: ${{ secrets.FALA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FALA_DEBUG_KEYSTORE_BASE64" ]; then
            umask 077
            mkdir -p "$HOME/.android"
            printf '%s' "$FALA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: fala-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
