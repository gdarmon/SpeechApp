name: Prepare Google Play store
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture/audit, upload store assets, or explicitly promote an existing internal build to Alpha
        type: choice
        options: [capture, upload, promote-alpha]
        default: capture
      version_code:
        description: Exact existing internal Play version code (required only for promote-alpha)
        type: string
        required: false
      replace_pending_review:
        description: Explicitly replace a pending Play review and resubmit all pending changes with this Alpha build
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fala-play-internal
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit, upload listing, or promote the specified closed-test build
        env:
          STORE_MODE: ${{ inputs.mode }}
          FALA_CLOSED_VERSION_CODE: ${{ inputs.version_code }}
          FALA_REPLACE_PENDING_REVIEW: ${{ inputs.replace_pending_review }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          case "$STORE_MODE" in
            capture) node scripts/play-store.mjs ;;
            upload) node scripts/play-store.mjs upload ;;
            promote-alpha) node scripts/play-promote.mjs ;;
            *) exit 1 ;;
          esac
      - name: Keep store preparation receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-store-receipt
          path: artifacts/play-store/*.json
  screenshots:
    if: inputs.mode == 'capture'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/capture-store-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-native-screenshots
          path: artifacts/play-store/screenshots
          if-no-files-found: error
