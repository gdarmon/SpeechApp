name: Deliver Fala reminders
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fala-reminders
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'gdarmon/SpeechApp'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke the authenticated Vercel scheduler
        env:
          FALA_REMINDER_TOKEN: ${{ secrets.FALA_REMINDER_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.FALA_REMINDER_TOKEN;
          if(!token || token.length<32)throw Error('Reminder scheduler credential is missing');
          const response=await fetch('https://fala-api.vercel.app/internal/reminders',{
            method:'POST',headers:{Authorization:`Bearer ${token}`},redirect:'error',signal:AbortSignal.timeout(35000)});
          if(!response.ok)throw Error(`Reminder request failed: HTTP ${response.status}`);
          const result=await response.json();
          console.log(JSON.stringify({delivered:result.delivered}));
          NODE
