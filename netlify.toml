[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Choose Frankfurt in the Netlify dashboard if your plan supports region selection.
# Leaving region unset keeps this repository importable on Free/Personal plans.
# On Pro/Enterprise you may alternatively uncomment:
# [functions.api]
#   region = "fra"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Google Identity Services injects a button stylesheet; only styles allow inline content.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style 'unsafe-inline'; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; media-src 'self' blob:; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
